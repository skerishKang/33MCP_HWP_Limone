name: Python contract checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    name: Windows-free mocked regressions
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax check
        run: python -m compileall -q advanced_hwp_server.py tests scripts
      - name: Mocked regression tests (not Windows/HWP acceptance)
        run: python -m unittest discover -s tests -v
